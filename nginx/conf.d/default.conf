# Rate limit zone (http 컨텍스트: conf.d는 http 블록 내부에 include됨)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

upstream backend {
    # 로드밸런싱 전략(택1) — 기본은 Round Robin
    # least_conn;          # Least Connections
    # ip_hash;             # IP Hash (동일 클라이언트 고정)
    server backend:8080;   # 기동 시 Docker DNS가 3 replica IP로 확장 → 3 피어로 분산
                           # (weight=N은 동일 replica라 차등 의미 제한)
}

server {
    listen 80;
    server_name _;

    # 공통 proxy 헤더 (자체 proxy_set_header 없는 location에 상속됨)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 게이트웨이 경유 표식
    add_header X-Gateway-Processed "true";

    # SSE: 버퍼링 off + 긴 타임아웃 (rate limit 미적용)
    location ^~ /api/sse {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        # location에 add_header가 생기면 server 레벨 헤더가 무시되므로 함께 재선언
        add_header X-Gateway-Processed "true";
        add_header X-Upstream-Server $upstream_addr;
    }

    # REST API: rate limit 적용
    location ^~ /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend;
        add_header X-Gateway-Processed "true";
        add_header X-Upstream-Server $upstream_addr;
    }

    # WebSocket(STOMP/SockJS): 업그레이드 헤더 (rate limit 미적용)
    location ^~ /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        add_header X-Gateway-Processed "true";
        add_header X-Upstream-Server $upstream_addr;
    }

    # 정적 프론트엔드(SPA)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
