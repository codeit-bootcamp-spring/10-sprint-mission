server {
    #nginx 컨테이너 내부에서 80번 포트로 요청을 받겠다.
    listen 80;
    # nginx의 기본 정적 파일 경로 nginx 컨테이너 내부의 /usr/share/nginx/html에 index.html있으면 반환
    root /usr/share/nginx/html;
    index index.html;

    #/api/로 시작하는 요청처리
    location /api/ {
        #docker container app:8080으로 전달.
        proxy_pass http://app:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
    }
    # /ws/로 시작하는 요청처리: websocket
    location /ws/ {
        # docker container app:8080으로 전달.
        proxy_pass http://app:8080/ws/;
        proxy_http_version 1.1;

        # websocket은 처음에 http 요청이고 이후 websocket으로 프로토콜 변경이 필요하다.
        # 아래 설정이 없으면 websocket handshake 실패
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 프론트엔드의 라우팅을 처리하기위한 설정
    # /api, /ws에 걸리지 않는 나머지 모든 요청 처리.
    # 요청받은 경로에 해당하는 파일이 실제 존재하는지 순서대로 찾아보고, 없으면 index.html을 반환해라
    location / {
        try_files $uri $uri/ /index.html;
    }
}


