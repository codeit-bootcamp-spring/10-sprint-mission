upstream backend {
    #기본값 Round Robin: 순서대로 돌아가면서 분배
    # least_conn
    # ip_hash
    server backend:8080;
}

server {
    #nginx 컨테이너 내부에서 80번 포트로 요청을 받겠다.
    listen 80;
    # nginx의 기본 정적 파일 경로 nginx 컨테이너 내부의 /usr/share/nginx/html에 index.html있으면 반환
    root /usr/share/nginx/html;
    index index.html;

    #/api/sse로 시작하는 요청 처리.
    location ^~ /api/sse {
        #backend 컨테이너중 하나
        proxy_pass http://backend/api/sse;
        #http 1.1사용
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        #실제 사용자 ip 전달
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        #nginx는 event를 버퍼에 모았다가 나중에 한번에 전송한다.
        #sse는 바로 전달을 원하기때문에 buffer 제거.
        proxy_buffering off;

        #실시간 이벤트라 캐시금지.
        proxy_cache off;

        #응답 헤더추가.
        #실제 처리한 backend 주소 추가.
        #로드 밸런싱 확인 가능.
        add_header X-Upstream-Server $upstream_addr always;
    }

    location ^~ /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;

        add_header X-Upstream-Server $upstream_addr always;
    }

    location ^~ /ws/ {
        proxy_pass http://backend/ws/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Upstream-Server $upstream_addr always;
    }

    # 프론트엔드의 라우팅을 처리하기위한 설정
    # /api, /ws에 걸리지 않는 나머지 모든 요청 처리.
    # 요청받은 경로에 해당하는 파일이 실제 존재하는지 순서대로 찾아보고, 없으면 index.html을 반환해라
    location / {
        try_files $uri $uri/ /index.html;
    }
}


