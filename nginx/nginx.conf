# nginx/nginx.conf

events {
    worker_connections 1024;
}

http {
    # CSS, JS 파일 등이 텍스트로 깨지지 않고 정상 적용되도록 MIME 타입 포함
    include       mime.types;
    default_type  application/octet-stream;

    # 백엔드 서버 그룹 정의 (docker-compose의 서비스 이름 'app' 사용)
    upstream backend {
        server app:80;
    }

    server {
        # Docker 컨테이너 내부에서는 80번 포트로 요청을 받음 (외부 3000 -> 내부 80)
        listen 80;
        server_name localhost;

        # 1. API 요청 리버스 프록시
        location /api/ {
            proxy_pass http://backend;

            # 클라이언트의 실제 IP와 호스트 정보를 백엔드로 전달
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. WebSocket 요청 리버스 프록시 (실시간 통신)
        location /ws/ {
            proxy_pass http://backend;

            # 웹소켓 연결 유지를 위한 필수 헤더 설정
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # 웹소켓 연결이 끊기지 않도록 타임아웃 시간 연장 (선택적 안정성 향상)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 3. 프론트엔드 정적 파일 서빙 (위의 경로에 해당하지 않는 모든 요청)
        location / {
            root /usr/share/nginx/html;
            index index.html;

            # 파일이 없으면 index.html로 돌려보내 SPA 라우팅 지원
            try_files $uri $uri/ /index.html;
        }
    }
}