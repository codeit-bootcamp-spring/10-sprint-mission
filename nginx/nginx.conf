worker_processes auto;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 백엔드 애플리케이션 서버 그룹을 정의
    upstream backend_servers {
        # app 컨테이너 8080번 포트
        server app:8080 max_fails=3 fail_timeout=5s; # 5초 안에 3번 실패 시 일시적으로 장애로 간주
    }

    # HTTP 요청을 처리하는 가상 서버 설정
    server {
        # 컨테이너 내부에서 80번 포트로 요청을 받음
        listen 8080;

        # 프론트엔드 정적 파일이 위치한 컨테이너 내부 경로
        # 예시 : /usr/share/nginx/html/index.html
        root /usr/share/nginx/html;
        # 디렉터리 요청 시 기본으로 반환할 파일
        index index.html;

        location /api/sse {
            # 요청을 backend_servers 그룹으로 전달
            proxy_pass http://backend_servers;
            # HTTP/1.1
            # nginx 프록시 기본 HTTP 버전은 1.0 / WebSocket upgrade는 HTTP/1.1 기반
            proxy_http_version 1.1;
            # 원래 클라이언트 요청의 Host 헤더를 백엔드 서버로 전달
            proxy_set_header Host $host;
            # 실제 클라이언트의 IP 주소를 X-Real-IP 헤더에 담아 전송
            proxy_set_header X-Real-IP $remote_addr;
            # 요청이 거친 각 클라이언트와 프록시들의 IP를 X-Forwarded-For 헤더에 누적해 전달
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 원래 요청 프로토콜을 백엔드로 전달(http, https)
            proxy_set_header X-Forwarded-Proto $scheme;
            # 백엔드 서버가 보낸 SSE 이벤트를 모아두지 않고, 받는 대로 클라이언트에게 전달
            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocke Upgrade 헤더를 백엔드로 전달
            proxy_set_header Upgrade $http_upgrade;
            # 연결을 WebSocket으로 업그레이드하도록 전달
            proxy_set_header Connection "upgrade";
        }

        # API와 WebSocket 요청이 아닌 다른 요청들을 프론트엔드로 처리
        location / {
            try_files $uri $uri/ /index.html;
        }

    }
}