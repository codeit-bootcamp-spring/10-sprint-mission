services:
  backend:
    build: ./app
    environment:
      SERVER_PORT: 8080
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      DISCODEIT_STORAGE_TYPE: ${STORAGE_TYPE}
      DISCODEIT_STORAGE_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      DISCODEIT_STORAGE_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      DISCODEIT_STORAGE_S3_REGION: ${AWS_S3_REGION}
      DISCODEIT_STORAGE_S3_BUCKET: ${AWS_S3_BUCKET}
      DISCODEIT_STORAGE_S3_PRESIGNED_URL_EXPIRATION: ${AWS_S3_PRESIGNED_URL_EXPIRATION}
      ADMIN_ID: ${ADMIN_ID}
      ADMIN_PW: ${ADMIN_PW}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092
    networks: [frontend_network, backend_network]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 3
      restart_policy:
        condition: on-failure

  db:
    image: postgres:17
    container_name: Db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      # /docker-entrypoint-initdb.d/init.sql가 관례. ro는 ReadOnly 읽기모드
      - ./app/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [backend_network]
    healthcheck:
      # pg_isready -U 유저명만 입력하면, Postgres는 기본적으로 유저명과 똑같은 이름의 데이터베이스에 접속을 시도
      # -d로 DB도 지정해줘야
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: Redis
    volumes:
      - redis-data:/data
    networks: [backend_network]
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: Broker
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks: [backend_network]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: Nginx
    depends_on: [backend]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/static:/usr/share/nginx/html:ro
    networks: [frontend_network]
    ports:
      - "127.0.0.1:3000:80"

volumes:
  db-data:
  redis-data:

networks:
  frontend_network:
  backend_network:

