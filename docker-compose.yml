services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: discodeit-reverse-proxy
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/main/resources/static:/usr/share/nginx/html:ro
    networks:
      - public
      - private

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discodeit-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      broker:
        condition: service_started
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-discodeit}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-discodeit_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-discodeit_password}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092
      KAFKA_CONSUMER_GROUP_ID: discodeit-group

      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_ROOT_PATH: /app/storage

      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY:-}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-ap-northeast-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_PRESIGNED_URL_EXPIRATION: ${AWS_S3_PRESIGNED_URL_EXPIRATION:-600}

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-your-access-token-secret-key-here-make-it-long-and-random}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-1800000}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-token-secret-key-here-make-it-different-and-long}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}

      DISCODEIT_ADMIN_USERNAME: ${DISCODEIT_ADMIN_USERNAME:-admin}
      DISCODEIT_ADMIN_EMAIL: ${DISCODEIT_ADMIN_EMAIL:-admin@discodeit.com}
      DISCODEIT_ADMIN_PASSWORD: ${DISCODEIT_ADMIN_PASSWORD:-admin123}

      JVM_OPTS: ${JVM_OPTS:-}
    volumes:
      - binary-content-data:/app/storage
    networks:
      - private

  db:
    image: postgres:15
    container_name: discodeit-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discodeit}
      POSTGRES_USER: ${POSTGRES_USER:-discodeit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discodeit_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - private

  redis:
    image: redis:7.2-alpine
    container_name: discodeit-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - private

  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: discodeit-broker
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - private

volumes:
  postgres-data:
  redis-data:
  binary-content-data:

networks:
  public:
    driver: bridge

  private:
    driver: bridge
    internal: true