services:
  reverse-proxy:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: discodeit-reverse-proxy
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - discodeit-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discodeit-backend
    env_file:
      - discodeit.env
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # Docker Compose 내부 PostgreSQL 컨테이너로 접속
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/discodeit
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092

      # Local Storage 사용
      STORAGE_TYPE: local
      DISCODEIT_STORAGE_TYPE: local
    depends_on:
      - postgres
      - redis
      - broker
    networks:
      - discodeit-network

  postgres:
    image: postgres:17
    container_name: discodeit-postgres
    environment:
      POSTGRES_DB: discodeit
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - discodeit-network

  redis:
    image: redis:7-alpine
    container_name: discodeit-redis
    volumes:
      - redis-data:/data
    networks:
      - discodeit-network

  broker:
    image: apache/kafka:3.7.0
    container_name: discodeit-broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - discodeit-network

volumes:
  postgres-data:
  redis-data:
  kafka-data:

networks:
  discodeit-network:
    driver: bridge