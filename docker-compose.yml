version: '3.9'
services:
  # Postgres DB
  postgres-db:
    container_name: database-app
    image: postgres:15
    #    ports:
    #      - '5432:5432' # 포트 변경 가능
    networks:
      - backend
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 3s   # 3초마다 체크
      timeout: 3s    # 3초 넘어가면 실패로 간주
      retries: 10    # 10번까지 재시도
      start_period: 5s # 컨테이너 켜지고 5초 동안은 실패해도 봐줌

  
  # spring boot application
  discodeit:
    container_name: discodeit-app
    build: .
    image: discodeit:local-slim # 이미지 이름
    #    ports:
    #      - '8081:80'
    networks:
      - backend
    volumes:
      - app-storage:/app/${STORAGE_LOCAL_ROOT_PATH} # local 파일 저장소 경로랑 동일
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}
      # 데베 설정
      DB_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      DB_USER_NAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # S3 설정
      STORAGE_TYPE: ${STORAGE_TYPE}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      AWS_S3_REGION: ${AWS_S3_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_PRESIGNED_URL_EXPIRATION: ${AWS_S3_PRESIGNED_URL_EXPIRATION}
      # local
      STORAGE_LOCAL_ROOT_PATH: ${STORAGE_LOCAL_ROOT_PATH} # 파일 저장소 경로
      #Redis&Kafka
      REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092
    env_file:
      - .env
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker:
        condition: service_started

  # Nginx 컨테이너
  nginx-proxy:
    container_name: discodeit-nginx
    image: nginx:stable-alpine # 이미지 이름
    ports:
      - '3000:3000'
    networks:
      - backend
      - public-net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/main/resources/static:/usr/share/nginx/html:ro
    depends_on:
      - discodeit

  # Redis
  redis:
    image: redis:7.2-alpine
    container_name: redis
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 5

  # Kafka
  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: broker
    networks:
      - backend
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

# 네트워크 설정(기본으로 같은 네트워크에 생성되기 때문에 생략가능)
networks:
  backend:
    driver: bridge # default, 생략 가능
    internal: true
  public-net:
    driver: bridge

# 볼륨 설정
volumes:
  db-data:
  app-storage:
  redis-data: