services:
  app:
    build: .
    image: discodeit-backend:2.2-M11
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_REGION: ${AWS_S3_REGION}
      AWS_S3_PRESIGNED_URL_EXPIRATION: ${AWS_S3_PRESIGNED_URL_EXPIRATION}
      STORAGE_TYPE: ${STORAGE_TYPE}
      LOCAL_STORAGE_ROOT_PATH: ${LOCAL_STORAGE_ROOT_PATH}
      LOCAL_STORAGE_INTERNAL_PATH: ${LOCAL_STORAGE_INTERNAL_PATH}
      S3_STORAGE_INTERNAL_PATH: ${S3_STORAGE_INTERNAL_PATH}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}
      JWT_REGISTRY_STORE_TYPE: ${JWT_REGISTRY_STORE_TYPE}
      JWT_REGISTRY_MAX_CONCURRENT: ${JWT_REGISTRY_MAX_CONCURRENT}
      JWT_REGISTRY_MAX_RETAINED: ${JWT_REGISTRY_MAX_RETAINED}
      SPRING_CACHE_TYPE: ${SPRING_CACHE_TYPE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

  web-server:
    build:
      context: discodeit-front
    image: discodeit-frontend:2.2.0
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./.storage/local-uploads:/usr/share/nginx/html/uploads
    environment:
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_REGION: ${AWS_S3_REGION}
