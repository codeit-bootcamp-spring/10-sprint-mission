services:
  app:
    build: .
    image: discodeit-backend:1.2-M8
    restart: always
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_REGION: ${AWS_S3_REGION}
      AWS_S3_PRESIGNED_URL_EXPIRATION: ${AWS_S3_PRESIGNED_URL_EXPIRATION}
      STORAGE_TYPE: ${STORAGE_TYPE}
      LOCAL_STORAGE_ROOT_PATH: ${LOCAL_STORAGE_ROOT_PATH}

  web-server:
    build:
      context: ./0-sprint-mission-front-1.2.3
    image: discodeit-frontend:1.2.3
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - local-uploads:/usr/share/nginx/html/uploads
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template
    environment:
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_REGION: ${AWS_S3_REGION}

volumes:
  local-uploads:
