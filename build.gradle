plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.10'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.sprint.mission'
//version = '0.0.1-SNAPSHOT'
version = '3.0-M12'
description = 'Demo project for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.15'
    compileOnly 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    runtimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Lombok이랑 같이 쓰려면 필요
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    //implementation 'de.codecentric:spring-boot-admin-starter-client:3.4.5'
    implementation 'software.amazon.awssdk:s3:2.31.7'
    //시큐리티
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.3'

    implementation 'org.springframework.retry:spring-retry'

    //캐시
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    //카프카
    implementation 'org.springframework.kafka:spring-kafka'

    //redis

    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    //웹소켓
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.security:spring-security-messaging'
}

test {
    useJUnitPlatform {
        def includeTag = System.getProperty('junit.jupiter.tags.include')
        if (includeTag) {
            includeTags includeTag
        }
    }
    systemProperty 'spring.profiles.active', 'test'
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    "**/*Application*",
                    "**/config/**",
                    "**/util/**",
                    "**/*Dto*",
                    "**/*Request*",
                    "**/*Response*",
                    "**/Interceptor*",
                    "**/Exception*",
                    "**/entity/**",
                    "**/*Mapper*",
                    "**/resources/**",
                    "**/testdata/**"
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'PACKAGE' // 그 외 범위: 'BUNDLE', 'CLASS' 등
            // 경로
            includes = ['com.sprint.mission.discodeit.service.basic']
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.6
            }
        }
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    "**/*Application*",
                    "**/config/**",
                    "**/util/**",
                    "**/*Dto*",
                    "**/*Request*",
                    "**/*Response*",
                    "**/Interceptor*",
                    "**/Exception*",
                    "**/entity/**",
                    "**/*Mapper*",
                    "**/resources/**",
                    "**/testdata/**"
            ])
        }))
    }
}
// 빌드 시 coverage 체크를 강제
check.dependsOn jacocoTestCoverageVerification