spring:
  application:
    name: discodeit

  datasource:
    url: jdbc:h2:mem:test-practice-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: debug          # 실행되는 SQL 쿼리 출력
    org.hibernate.orm.jdbc.bind: trace # SQL에 들어가는 실제 파라미터 값 확인
    com.sprint.mission.discodeit: debug # 내 코드의 디버그 로그 출력

discodeit:
  storage:
    type: local   # local | remote
    local:
      root-path: "${user.dir}/data"