spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console
logging:
  level:
    root: info
    com.sprint.mission.discodeit: debug
    org.hibernate.jdbc.bind: trace
    org.hibernate.SQL: info
management:
  endpoints:
    web:
      exposure:
        include: "health,info,loggers,metrics"
        exclude: ""
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
info:
  app:
    name: Discodeit
    version: 1.7.0
    java:
      version: 17
    spring:
      boot:
        version: 3.4.0
    datasource:
      url: ${spring.datasource.url}
      driver-class-name: ${spring.datasource.driver-class-name}
      storage:
        type: ${discodeit.storage.type}
        root-path: ${discodeit.storage.local.root-path}
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
discodeit:
  storage:
    type: s3
    local:
      root-path: ./uploads
    s3:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
      region: ${AWS_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}
server:
  port: 8080