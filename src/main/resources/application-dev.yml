springdoc:
  swagger-ui:
    url: /api.json

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database: PostgreSQL
    defer-datasource-initialization: false
    properties:
      hibernate:
        format_sql: false
        jdbc.batch_size: 100
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 500
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    root: info
    com.sprint.mission.discodeit: debug
    org.hibernate.orm.jdbc.bind: warn
    org.hibernate.SQL: warn
    org.springframework.security: trace
