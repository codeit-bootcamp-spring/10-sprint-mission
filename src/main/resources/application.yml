spring:
  profiles:
    active: dev

  application:
    name: discodeit

  boot:
    admin:
      client:
        instance:
          name: discodeit

discodeit:
  storage:
    type: local   # local | remote
    local:
      root-path: "${user.dir}/data"

management:
  info:
    env:
      enabled: true

info:
  app:
    name: Discodeit
    version: 1.7.0
    java-version: 17
    spring-boot-version: 3.4.0
  config:
    datasource:
      url: ${spring.datasource.url}
      driver-class-name: ${spring.datasource.driver-class-name}
    jpa:
      ddl-auto: ${spring.jpa.hibernate.ddl-auto}
    storage:
      type: ${discodeit.storage.type}
      path: ${discodeit.storage.local.root-path}
    multipart:
      max-file-size: ${spring.servlet.multipart.max-file-size:1MB}
      max-request-size: ${spring.servlet.multipart.max-request-size:10MB}