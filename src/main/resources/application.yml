discodeit:
  storage:
    type: ${STORAGE_TYPE:local}  # local | s3 (기본값: local)
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600} # (기본값: 10분)

spring:
  application:
    name: discodeit
  profiles:
    active: dev # 기본적으로 dev 환경 활성화
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  cache:
    type: caffeine

logging:
  level:
    root: info

    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.transaction.interceptor: TRACE
    org.springframework.transaction.support.AbstractPlatformTransactionManager: TRACE
    org.springframework.orm.jpa.JpaTransactionManager: TRACE
    org.springframework.orm.jpa: DEBUG

# Actuator 엔드포인트 노출 설정
management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "health" # 공통 설정에서는 health만 최소한으로 노출
  endpoint:
    health:
      show-details: never
  observations:
    annotations:
      enabled: true

info:
  app:
    name: Discodeit
    version: 1.7.0
    java-version: 17
    spring-boot-version: 3.4.0
  config:
    datasource:
      url: ${spring.datasource.url}
      driver-class-name: ${spring.datasource.driver-class-name}
    jpa:
      ddl-auto: ${spring.jpa.hibernate.ddl-auto}
    storage:
      type: ${discodeit.storage.type}
      path: ${discodeit.storage.local.root-path}
    multipart:
      max-file-size: ${spring.servlet.multipart.max-file-size}
      max-request-size: ${spring.servlet.multipart.max-request-size}

jwt:
  secret: ${JWT_SECRET:ih8awvLLzBzgjrWS9kFtLXRVrFRYLtJNzexVgbenjLg=} # 로컬 환경에서는 뒤에 적힌 기본값을 사용하고,운영 환경에서 컨테이너 띄울 때는 OS 환경변수로 JWT_SECRET을 주입하여 덮어씌워 사용
  access-expiration: 900000 # 15분 (1000 * 60 * 15)
  refresh-expiration: 604800000 # 7일 (1000 * 60 * 60 * 24 * 7)