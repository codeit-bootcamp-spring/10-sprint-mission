discodeit:
  storage:
    type: local
    local:
      root-path: ./discodeit-storage

spring:
  application:
    name: discodeit

  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  sql:
    init:
      mode: always

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

    org.springframework.transaction.interceptor: TRACE
    org.springframework.transaction.support.AbstractPlatformTransactionManager: TRACE
    org.springframework.orm.jpa.JpaTransactionManager: TRACE

    org.springframework.orm.jpa: DEBUG