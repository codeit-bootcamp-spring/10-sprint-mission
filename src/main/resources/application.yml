spring:
  application:
    name: discodeit
  profiles:
    active: prod

management:
  endpoints:
    web:
      exposure:
        include: '*'
  info:
    env:
      enabled: true

info: #/actuator/info에 노출되는 영역.
  app:
    name: Discodeit   #애플리케이션 이름 이름
    version: 1.7.0    #애플리케이션 버전
  java:
    version: 17       #자바 버전
  spring:
    boot:
      version: 3.4.0  #Spring Boot 버전
