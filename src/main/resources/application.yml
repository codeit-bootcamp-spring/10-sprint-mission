spring:
  application:
    name: discodeit
  profiles:
    active: dev
logging:
  level:
    org.springframework.security: DEBUG
admin:
  init:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
jwt:
  key: ${JWT_SECRET_KEY}
  access-token-expiration-minutes: 30
  refresh-token-expiration-minutes: 420