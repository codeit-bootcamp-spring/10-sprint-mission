server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

logging:
  level:
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: debug
    org.springframework.security: TRACE

discodeit:
  admin:
    username: ${DISCODEIT_ADMIN_USERNAME:admin}
    email: ${DISCODEIT_ADMIN_EMAIL:admin@admin.com}
    password: ${DISCODEIT_ADMIN_PASSWORD:admin1234!}

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        # 성능 측정 및 디버깅을 위해 dev 프로필에서만 완전 노출
        include: "health,info,metrics,loggers,observations"
  endpoint:
    health:
      show-details: always # 개발 시 상세한 내부 인프라 상태 확인