server:
  port: 80

spring:
  application:
    name: discodeit
  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_CLIENT_URL}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
  jpa:
    hibernate:
      ddl-auto: none
    sql:
      init:
        mode: never
    open-in-view: false

logging:
  level:
    root: INFO
    com.sprint.mission.discodeit: info

info:
  config:
    datasource:
      url: jdbc:postgresql://localhost:5432/discodeit
      driver-class-name: org.postgresql.Driver
    jpa:
      ddl-auto: none
    storage:
      type: local
      path: ./storage
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB