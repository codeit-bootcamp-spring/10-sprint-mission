server:
  port: 80

spring:
  datasource:
    url: jdbc:postgresql://prod-db-url:5432/discodeit_prod
    username: prod_user
    password: prod_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # 운영은 스키마를 건드리지 않음

logging:
  level:
    com.sprint.mission.discodeit: info # 운영 환경은 info