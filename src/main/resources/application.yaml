spring:
  profiles:
    active: dev
  application:
    name: discodeit
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false                    # 웹 요청이 끝날 때까지 JPA Session 열어두는 역할(default: true)
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 100     # 한 쿼리문 batch size 개수
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 10MB
  #        format_sql: true
  cache:
    cache-names: channelsByUser, notificationsByUser, userCache
    caffeine:
      spec: >
        maximumSize=100,
        expireAfterAccess=600s,
        recordStats
    type: redis
    redis:
      enable-statistics: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: discodeit-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

discodeit:
  admin:
    id: ${ADMIN_ID}
    pw: ${ADMIN_PW}
    email: ${ADMIN_EMAIL}
  repository:
    type: file
    file-directory: .discodeit
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600} # (default: 10분)
  jwt:
    secure: true
    key: ${JWT_SECRET_KEY}
    access-token-expiration-minutes: 10                 # 10분
    refresh-token-expiration-minutes: '#{60 * 24 * 7}'  # 일주일
  kafka:
    enabled: true

logging.level:
  root: info
  com.sprint.mission.discodeit: info
  org.hibernate.SQL: info                  # SQL 실행
#  org.hibernate.orm.jdbc.bind: trace      # 파라미터 설정(DB에 보내는 값)
#  org.hibernate.orm.jdbc.extract: trace   # 결과 읽기(DB에서 받아온 값)

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers, caches
  info.env.enabled: true
  observations:
    annotations:
      enabled: true

info:
  app:
    name: Discodeit
    version: 0.0.1
    java-version: 17
    spring-boot-version: 3.5.10
  configuration:
    datasource:
      url: ${spring.datasource.url}
      driver: ${spring.datasource.driver-class-name}
    jpa:
      ddl-auto: ${spring.jpa.hibernate.ddl-auto}
    storage:
      type: ${discodeit.storage.type}
      path: ${discodeit.storage.local.root-path}
    multipart:
      # ${}에 감싸져 있는 참조값은 default값이 있어도 파일에 명시해야 ${}가 제기능을 발휘함
      max-file-size: ${spring.servlet.multipart.max-file-size}
      max-request-size: ${spring.servlet.multipart.max-request-size}

