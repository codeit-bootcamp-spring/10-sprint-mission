discodeit:
  repository:
    type: file # jcf | file
    file-directory: .discodeit
  storage:
    type: local
    local:
      root-path: .discodeit

spring:
  profiles:
    active: prod

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

    open-in-view: false

logging:
  level:
    root: INFO