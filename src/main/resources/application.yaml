spring:
  application:
    name: discodeit
  profiles:
    active: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  boot:
    admin:
      client:
        instance:
          name: discodeit
  cache:
    type: redis
    cache-names:
      - users
      - userChannels
      - userNotifications

    caffeine:
      spec: >
        maximumSize=100,
        expireAfterAccess=600s,
        recordStats
    redis:
      enable-statistics: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

discodeit:
  storage:
    type: s3
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
  repository:
    type: file
    file-directory: .discodeit

aws:
  region: ${AWS_S3_REGION:ap-northeast-2}
  credentials:
    access-key: ${AWS_S3_ACCESS_KEY:dummy}
    secret-key: ${AWS_S3_SECRET_KEY:dummy}
  s3:
    bucket: ${AWS_S3_BUCKET:dummy}

# Swagger (SpringDoc) 설정 추가
springdoc:
  swagger-ui:
    path: /docs                     # Swagger UI 접속 경로: http://localhost:8080/docs
    display-request-duration: true  # API 요청 실행 시간 표시
  api-docs:
    path: /v3/api-docs              # OpenAPI 명세 JSON 경로
  default-produces-media-type: application/json
  info:
    title: "Discodeit API Document"
    description: "실시간 채팅 서비스 Discodeit의 서버 API 명세서입니다."
    version: "1.0.0"

logging:
  level:
    root: info

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,loggers,caches"
  health:
    show-details: always

  observations:
    annotations:
      enabled: true

info:
  app:
    name: Discodeit
    version: 1.2-M8
    java-version: 17
    spring-boot-version: 3.4.0
  major-config:
    datasource:
      url: ${spring.datasource.url}
      driver-class-name: ${spring.datasource.driver-class-name}
    jpa:
      ddl-auto: ${spring.jpa.hibernate.ddl-auto}
    storage:
      type: ${discodeit.storage.type}
      path: ${discodeit.storage.local.root-path}
    multipart:
      max-file-size: ${spring.servlet.multipart.max-file-size:10MB}
      max-request-size: ${spring.servlet.multipart.max-request-size:10MB}
jwt:
  key: ${JWT_SECRET_KEY}
  access-token-expiration-minutes: 30
  refresh-token-expiration-minutes: 420
  max-active-count: 5
