#file: noinspection YAMLSchemaValidation
spring:
  application:
    name: discodeit
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate  # Entity를 보고 Table 자동 생성 여부 설정
    open-in-view: false
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cache:
    type: ${CACHE_TYPE:caffeine}
    cache-names:
      - channelList
      - notificationList
      - userList
    caffeine:
      spec: >
        maximumSize=100,
        expireAfterWrite=300s,
        recordStats
    redis:
      enable-statistics: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:discodeit-group}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

discodeit:
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  storage: # 파일 저장소 관련 설정
    type: ${STORAGE_TYPE:local}
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY:}
      secret-key: ${AWS_S3_SECRET_KEY:}
      region: ${AWS_S3_REGION:}
      bucket: ${AWS_S3_BUCKET:}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}
  security:
    jwt:
      jwt_secret_key: ${JWT_SECRET_KEY:}
      access-token_expiration-time: ${JWT_ACCESS_TOKEN_EXPIRATION_TIME:}
      refresh-token_expiration-time: ${JWT_REFRESH_TOKEN_EXPIRATION_TIME:}

logging:
  level:
    root: INFO # 전체 로그 레벨 설정

management:
  endpoints:
    web:
      exposure:
        include: 'health, info, metrics, loggers, caches'
  info:
    env:
      enabled: true
  observations:
    annotations:
      enabled: true # @Timed 같은 Micrometer 관찰/metric 애너테이션 동작 설정

info:
  app:
    name: "Discodeit"
    version: "1.7.0"
    java-version: "17"
    spring-boot-version: "3.5.0"
  datasource:
    url: ${spring.datasource.url}
    driver-class-name: ${spring.datasource.driver-class-name}
  jpa:
    ddl-auto: ${spring.jpa.hibernate.ddl-auto}
  storage:
    type: ${discodeit.storage.type}
#    path: ${discodeit.storage.local.root-path}
  multipart:
    max-file-size: ${spring.servlet.multipart.max-file-size}
    max-request-size: ${spring.servlet.multipart.max-request-size}
