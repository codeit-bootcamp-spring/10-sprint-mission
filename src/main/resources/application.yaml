spring:
  application:
    name: discodeit
  servlet:
    multipart:
      maxFileSize: 10MB # 파일 하나의 최대 크기
      maxRequestSize: 30MB  # 한 번에 최대 업로드 가능 용량
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # 각 환경에서 명시적으로 주입하도록 수정
  #  profiles:
  #    active:
  #      - prod
  config:
    # optional: - 파일이 없어도 에러 없이 무시 (로컬 환경 아닐 때를 위함)
    # file:.env - classpath가 아닌 파일시스템 경로 .env를 가리킴
    # [.properties] - 해당 파일을 KEY=VALUE 형식으로 파싱하라
    import: optional:file:.env[.properties]

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always

info:
  name: Discodeit
  version: 1.7.0
  java:
    version: 17
  spring-boot:
    version: 3.4.0
  config:
    datasource:
      url: ${spring.datasource.url}
      driver-class-name: ${spring.datasource.driver-class-name}
    jpa:
      ddl-auto: ${spring.jpa.hibernate.ddl-auto}
    storage:
      type: ${discodeit.storage.type}
      path: ${discodeit.storage.local.root-path}
    multipart:
      max-file-size: ${spring.servlet.multipart.maxFileSize}
      max-request-size: ${spring.servlet.multipart.maxRequestSize}

discodeit:
  storage:
    type: ${STORAGE_TYPE:local}  # local | s3 (기본값: local)
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      # Default is 3600 seconds. Maximum is 604800 seconds. (AWS CLI 기준)
      # Java SDK(S3Presigner)는 기본값 X. Maximum - 7일.
      # .env 설정값 - 600 (10분)
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:300} # (기본값: 300s = 5분)

logging:
  level:
    root: info
