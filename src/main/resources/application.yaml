spring:
  application:
    name: discodeit
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 30MB
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

discodeit:
  storage:
    type: local
    local:
      root-path: .discodeit/binaryContent

