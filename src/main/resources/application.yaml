spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver
  application:
    name: discodeit
  sql.init.mode: always
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: true                    # 웹 요청이 끝날 때까지 JPA Session 열어두는 역할(default: true)
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 100     # 한 쿼리문 batch size 개수
#        format_sql: true

discodeit:
  repository:
    type: file
    file-directory: .discodeit
  storage:
    type: local
    local:
      root-path: .discodeit/upload

#logging.level:
#  org.hibernate.SQL: debug                # SQL 실행
#  org.hibernate.orm.jdbc.bind: trace      # 파라미터 설정(DB에 보내는 값)
#  org.hibernate.orm.jdbc.extract: trace   # 결과 읽기(DB에서 받아온 값)