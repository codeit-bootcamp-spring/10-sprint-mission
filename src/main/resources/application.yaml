spring:
  profiles:
    active: dev
  config:
    import: optional:file:./.env[.properties]

logging:
  level:
    org.springframework.security.web.DefaultSecurityFilterChain: trace
    root: info

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never


jwt:
  key: ${JWT_SECRET_KEY}
  access-token-expiration-minutes: 30
  refresh-token-expiration-minutes: 420



