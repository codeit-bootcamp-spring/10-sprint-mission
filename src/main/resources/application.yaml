spring:
  application:
    name: discodeit
  servlet:
    multipart:
      maxFileSize: 10MB # 파일 하나의 최대 크기
      maxRequestSize: 30MB  # 한 번에 최대 업로드 가능 용량
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    #        default_batch_fetch_size: 100
    open-in-view: false
  profiles:
    active: dev

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,loggers"

  info:
    application:
      name: Discodeit
      version: 1.7.0
    java:
      version: 17
    spring:
      boot:
        version: 3.4.0
    datasource:
      url: jdbc:postgresql://localhost:5432/discodeit
      username: discodeit_user
    jpa:
      ddl-auto: validate
    storage:
      type: local
      local:
        root-path: .discodeit/storage
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

logging:
  level:
    root: info
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

discodeit:
  storage:
    type: local
    local:
      root-path: .discodeit/storage