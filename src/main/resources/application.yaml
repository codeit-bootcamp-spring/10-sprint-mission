discodeit:
  storage:
    type: local
    local:
      root-path: .discodeit.storage

spring:
  profiles:
    active: dev
  servlet:
    multipart:    # binaryContent 활성화
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
logging:
  level:
    root: info
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.hibernate.orm.jdbc.extract: trace