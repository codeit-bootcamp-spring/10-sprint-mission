discodeit:
  repository:
    type: file # jcf | file
    file-directory: .discodeit
  storage:
    type: local
    local:
      root-path: .discodeit

spring:
  profiles:
    active: dev
    datasource:
      url: jdbc:postgresql://localhost:5432/discodeit
      username: discodeit_user
      password: discodeit1234
      driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

    open-in-view: false

logging:
  level:
    root: INFO