services:
  app:
    build: .
    image: discodeit:local    # 빌드 후 이미지 태깅
    ports: [ "8081:80" ]
    environment:
      SERVER_PORT: 80
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      DISCODEIT_STORAGE_TYPE: ${STORAGE_TYPE}
      DISCODEIT_STORAGE_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      DISCODEIT_STORAGE_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      DISCODEIT_STORAGE_S3_REGION: ${AWS_S3_REGION}
      DISCODEIT_STORAGE_S3_BUCKET: ${AWS_S3_BUCKET}
      DISCODEIT_STORAGE_S3_PRESIGNED_URL_EXPIRATION: ${AWS_S3_PRESIGNED_URL_EXPIRATION}
    command: [ "java","-jar","/app/app.jar" ]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-data:/var/lib/app/upload
    networks: [ backend ]


  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      # /docker-entrypoint-initdb.d/init.sql가 관례. ro는 ReadOnly 읽기모드
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [ backend ]
    healthcheck:
      # pg_isready -U 유저명만 입력하면, Postgres는 기본적으로 유저명과 똑같은 이름의 데이터베이스에 접속을 시도
      # -d로 DB도 지정해줘야
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  app-data:

networks:
  backend:  # default: Bridge
