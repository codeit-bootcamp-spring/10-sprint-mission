server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always # always, embedded, never

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    open-in-view: false

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.sprint.mission.discodeit: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "health, info, metrics, loggers"
  observations:
    annotations:
      enabled: true