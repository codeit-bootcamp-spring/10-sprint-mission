name: deploy.yml
on:
  push:
    branches:
      - release

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials for Public ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Log in to Public ECR
        run: |
          aws ecr-public get-login-password --region us-east-1 | \
          docker login --username AWS --password-stdin public.ecr.aws

      - name: Set image tags
        id: image
        run: |
          $IMAGE_URI = "${{ vars.ECR_REPOSITORY_URI }}"
          $IMAGE_TAG = "${{ github.sha }}"
          "image_uri=$IMAGE_URI`:$IMAGE_TAG" >> $env:GITHUB_OUTPUT
          "image_tag=$IMAGE_TAG" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Build Docker image
        run: |
          docker build -t ${{ vars.ECR_REPOSITORY_URI }}:latest -t ${{ steps.image.outputs.image_uri }} .

      - name: Push Docker image
        run: |
          docker push ${{ vars.ECR_REPOSITORY_URI }}:latest
          docker push ${{ steps.image.outputs.image_uri }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS credentials for ECS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_TASK_DEFINITION }}" \
            --query taskDefinition \
            > task-definition.json

      - name: Render new task definition
        run: |
          jq --arg IMAGE "${{ needs.build-and-push.outputs.image_uri }}" '
            .containerDefinitions[0].image = $IMAGE
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
          ' task-definition.json > task-definition-rendered.json

      - name: Register new task definition
        id: task-def
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-rendered.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_def_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Stop running service before deployment
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --desired-count 0
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}"

      - name: Deploy new task definition to ECS service
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --task-definition "${{ steps.task-def.outputs.task_def_arn }}" \
            --desired-count 1
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}"

      - name: Dump ECS service status on failure
        if: failure()
        run: |
          aws ecs describe-services \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}"

      - name: Dump ECS service events on failure
        if: failure()
        run: |
          aws ecs describe-services \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}" \
            --query 'services[0].events[0:10]'

      - name: Dump recent ECS tasks on failure
        if: failure()
        run: |
          TASK_ARNS=$(aws ecs list-tasks \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service-name "${{ vars.ECS_SERVICE }}" \
            --desired-status STOPPED \
            --max-items 10 \
            --query 'taskArns' \
            --output text)
          if [ -n "$TASK_ARNS" ]; then
            aws ecs describe-tasks \
              --cluster "${{ vars.ECS_CLUSTER }}" \
              --tasks $TASK_ARNS
          else
            echo "No stopped tasks found."
          fi
