# CI 워크플로우 이름
name: CI - Test

# 트리거 조건: 언제 이 워크플로우가 실행될지 정의
on:
  push: # push할 때 실행
    branches: [ sprint8 ] # sprint8 브랜치를 대상으로
  pull_request: # PR이 생성되거나 업데이트될 때 실행
    branches: [ main ] # main 브랜치를 대상으로 하는 PR만

# 권한 설정: 이 워크플로우가 가진 GitHub 토큰의 권한 범위
permissions:
  contents: read # 읽기만 가능

# 실제 실행할 작업 단위
jobs:
  test: # job ID, 다른 job에서 needs: test로 참조 가능
    runs-on: ubuntu-latest # 실행환경: GitHub가 제공하는 Ubuntu VM

    # job 내에서 순서대로 실행되는 개별 단계들
    steps:

      # 1) 소스코드 체크아웃
      # PR의 코드를 Runner VM에 클론
      - name: Checkout
        uses: actions/checkout@v4 # v6가 최신 버전. v4가 표준

      # 2) JDK 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      # 3) Gradle 의존성 캐싱
      # 이전 실행의 캐시를 재사용하여 빌드 시간을 단축
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # 다운로드된 의존성 라이브러리들 + Gradle Wrapper 자체의 바이너리 -> 캐싱
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          # 캐시 키: OS + gradle 설정 파일들의 해시값 -> build.gradle이 바뀌면 해시가 달라져 새 캐시 생성
          restore-keys: |
            ${{ runner.os }}-gradle-
            # 정확한 키가 없을 때 접두사만 일치하는 가장 최근 캐시를 사용

      # 4) Gradle Wrapper 실행 권한 부여
      # Gradlew == Gradle Wrapper: Gradle 실행 스크립트
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5) 테스트 실행 + 커버리지 리포트 생성
      # test: 전체 단위/통합 테스트 실행
      # jacocoTestReport: JaCoCo 플러그인으로 코드 커버리지 XML 리포트 생성
      - name: Run tests
        run: ./gradlew test jacocoTestReport

      # 6) 커버리지 결과를 Codecov에 업로드
      # Codecov: 코드 커버리지를 시각화하고 PR에 커버리지 변화를 코멘트해주는 서비스
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          # JaCoCo가 생성한 XML 리포트 파일 경로
          files: build/reports/jacoco/test/jacocoTestReport.xml
          # Codecov 업로드 실패 시에도 CI를 실패 처리하지 않음
          fail_ci_if_error: false
          # Codecov 인증 토큰 - GitHub Secrets에 저장된 값을 참조
          token: ${{ secrets.CODECOV_TOKEN }}
