name: CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: discodeit
          POSTGRES_USER: discodeit_user
          POSTGRES_PASSWORD: discodeit1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: schema.sql 실행
        run: |
          PGPASSWORD=discodeit1234 psql \
            -h localhost -U discodeit_user -d discodeit \
            -f src/main/resources/schema.sql

      - name: 테스트
        run: ./gradlew test jacocoTestReport --no-daemon
        env:
          STORAGE_TYPE: local

      - name: 테스트 결과 전송
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml