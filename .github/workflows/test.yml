name: CI Test

on:
  push:
    branches:
      - main
      - sprint8
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: gradle

      - name: Create .env for CI
        run: |
          cat <<EOF > .env
          STORAGE_TYPE=${{ secrets.STORAGE_TYPE }}
          STORAGE_LOCAL_ROOT_PATH=${{ secrets.STORAGE_LOCAL_ROOT_PATH }}
          DISCODEIT_STORAGE_LOCAL_ROOT_PATH=${{ secrets.DISCODEIT_STORAGE_LOCAL_ROOT_PATH }}
          AWS_S3_ACCESS_KEY=${{ secrets.AWS_S3_ACCESS_KEY }}
          AWS_S3_SECRET_KEY=${{ secrets.AWS_S3_SECRET_KEY }}
          AWS_S3_REGION=${{ secrets.AWS_S3_REGION }}
          AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
          EOF

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run tests and coverage
        run: ./gradlew clean test jacocoTestReport

      - name: Upload coverage to Codecov
        if: ${{ always() && hashFiles('build/reports/jacoco/test/jacocoTestReport.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: true
