name: CI Test

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1) 소스 체크아웃
      - name: Checkout
        uses: actions/checkout@v3

      # JDK 설정
      - name: JDK 17 설정
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # gradlew 실행 권한 설정
      - name: Grant execute permission
        run: chmod +x gradlew

      # 테스트 실행
      - name: Run tests
        run: ./gradlew clean test